version: '3.8'

services:
  backend:
    build: ./backend
    container_name: legend-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./local_legend.db
      - STRAVA_CLIENT_ID=${STRAVA_CLIENT_ID}
      - STRAVA_CLIENT_SECRET=${STRAVA_CLIENT_SECRET}
      - STRAVA_REDIRECT_URI=${STRAVA_REDIRECT_URI:-http://localhost:8000/api/auth/strava/callback}
    volumes:
      - ./backend:/app
      - backend-data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: legend-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
